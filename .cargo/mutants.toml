# cargo-mutants configuration (T5.6, AC8 test quality, design §5.2).
#
# The interesting mutants are in the gate and errno-policy code: the frame
# decoder, the protocol types, the state machine, the dispatcher gates, and
# the freeze/thaw algorithm. Run locally with:
#
#   cargo install cargo-mutants
#   cargo mutants --all-features
#
# The CI job (mutants in ci.yml) fails on any surviving mutant in these
# files; timeouts (the decoder loops) count as detections.
examine_globs = [
    "src/framing.rs",
    "src/proto.rs",
    "src/proto/bounds.rs",
    "src/state.rs",
    "src/dispatch.rs",
    "src/dispatch/ratelimit.rs",
    "src/handlers/fsfreeze.rs",
]
# Test doubles and the privileged/E2E plumbing are not worth mutating.
exclude_globs = [
    "src/kernel/fake.rs",
]
# Mutants that only change log text or Debug output are noise.
# (cargo-mutants names a mutant like "replace <impl std::fmt::Debug for
# Context>::fmt -> std::fmt::Result with Ok(Default::default())".)
exclude_re = [
    "Debug for",
    "Display for",
    "::fmt ",
    "::expecting ",
]
# Each mutant runs the unit tests only; the E2E and privileged suites are
# slow and covered by their own jobs.
test_tool = "cargo"
additional_cargo_test_args = ["--lib", "--locked"]
timeout_multiplier = 3.0
minimum_test_timeout = 60.0
