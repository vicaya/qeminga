name: AI maintenance (agent run)
description: >-
  Runs a coding-agent CLI (Claude Code, Codex, Antigravity, or another
  provider adapter) on the checkout with an API key chosen from an ordered
  key pool, falling back to the next key when one is exhausted, and
  uploads the agent's changes as a patch artifact. Needs no write access:
  publish/ opens the pull request from a separate job.

inputs:
  key-pool:
    description: 'JSON key pool, e.g. [{"claude":["k1","k2"]},{"gpt":["k3"]},{"gemini":["k4"]}]. Pass a secret.'
    required: true
  instructions:
    description: The maintenance instructions (pass a secret or a file's contents).
    required: true
  extra-prompt-file:
    description: Optional Markdown file appended to the prompt (the review feedback in review rounds).
    default: ""
  routing:
    description: "Routing strategy: ordered (default) or round-robin."
    default: ordered
  fallback-on:
    description: "Fall back to the next key when an attempt is: exhausted (quota, rate limit, bad key; default) or any (any failure)."
    default: exhausted
  models:
    description: 'Optional JSON object of provider -> model, e.g. {"claude":"claude-opus-5-5"}. A pool entry''s "model" wins.'
    default: ""
  effort:
    description: >-
      Optional reasoning effort: one level for every provider (low, medium,
      high, xhigh, max) or a JSON object of provider -> level, e.g.
      {"claude":"max","gpt":"high"}. A pool entry's "effort" wins; empty
      leaves each CLI's default.
    default: ""
  attempt-timeout:
    description: Time limit per attempt, as a timeout(1) duration.
    default: 60m
  working-directory:
    description: The checkout the agent works on.
    default: .
  node-version:
    description: Node.js for the npm-installed CLIs; empty to use the runner's.
    default: "22"
  claude-code-version:
    description: "@anthropic-ai/claude-code version."
    default: 2.1.319
  codex-version:
    description: "@openai/codex version."
    default: 0.167.0
  github-token:
    description: Read access to pull requests, for max-open-prs.
    default: ${{ github.token }}
  max-open-prs:
    description: Skip the run while this many maintenance PRs (branch-prefix) are open; 0 disables the check.
    default: "0"
  branch-prefix:
    description: Branch prefix of maintenance pull requests.
    default: ai-maintenance/
  result-artifact:
    description: Name of the artifact holding the result.
    default: ai-maintenance-result

outputs:
  status:
    description: changed, unchanged, failed or skipped.
    value: ${{ steps.gate.outputs.skip == 'true' && 'skipped' || steps.run.outputs.status || 'failed' }}
  provider:
    description: The provider that completed the run.
    value: ${{ steps.run.outputs.provider }}
  model:
    description: Its model (empty means the CLI's default).
    value: ${{ steps.run.outputs.model }}
  effort:
    description: Its reasoning effort (empty means the CLI's default).
    value: ${{ steps.run.outputs.effort }}
  title:
    description: First line of the agent's final message.
    value: ${{ steps.run.outputs.title }}
  base-sha:
    description: The commit the agent started from.
    value: ${{ steps.run.outputs.base-sha }}

runs:
  using: composite
  steps:
    - if: inputs.node-version != ''
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - id: gate
      if: inputs.max-open-prs != '0'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PREFIX: ${{ inputs.branch-prefix }}
        MAX: ${{ inputs.max-open-prs }}
      run: |
        open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName \
          --jq "[.[] | select(.headRefName | startswith(env.PREFIX))] | length")
        echo "open maintenance pull requests: $open (limit $MAX)"
        if [ "$open" -ge "$MAX" ]; then
          echo "skip=true" >>"$GITHUB_OUTPUT"
          echo "::notice::Skipped: $open maintenance pull request(s) already open."
        fi

    - id: run
      if: steps.gate.outputs.skip != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        AI_KEY_POOL: ${{ inputs.key-pool }}
        AI_INSTRUCTIONS: ${{ inputs.instructions }}
        AI_EXTRA_PROMPT_FILE: ${{ inputs.extra-prompt-file }}
        AI_ROUTING: ${{ inputs.routing }}
        AI_FALLBACK_ON: ${{ inputs.fallback-on }}
        AI_MODELS: ${{ inputs.models }}
        AI_EFFORT: ${{ inputs.effort }}
        AI_ATTEMPT_TIMEOUT: ${{ inputs.attempt-timeout }}
        AI_STATE_DIR: ${{ runner.temp }}/ai-maintenance
        CLAUDE_CODE_VERSION: ${{ inputs.claude-code-version }}
        CODEX_VERSION: ${{ inputs.codex-version }}
      run: '"$GITHUB_ACTION_PATH/run.sh"'

    - if: steps.run.outputs.status == 'changed' || steps.run.outputs.status == 'unchanged'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.result-artifact }}
        path: ${{ runner.temp }}/ai-maintenance/result
        retention-days: 7

    - if: always() && steps.run.outputs.logs-dir != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.result-artifact }}-logs
        path: ${{ steps.run.outputs.logs-dir }}
        retention-days: 14
