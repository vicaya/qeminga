# Design §5.8 / AC6: advisories can arrive without a source change, so the
# advisory scan also runs on a schedule, not only on pull requests.
name: Scheduled security audit

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  push:
    paths:
      - "Cargo.lock"
      - "Cargo.toml"
      - "deny.toml"
      - ".github/workflows/audit.yml"

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      # Prebuilt binary: building cargo-audit from source with the pinned
      # toolchain fails once one of its dependencies raises its MSRV.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  deny-advisories:
    name: cargo deny advisories
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
          arguments: --all-features
