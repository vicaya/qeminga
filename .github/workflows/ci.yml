name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - run: cargo fmt --all --check

  clippy:
    name: clippy (-D warnings)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  test:
    name: test (${{ matrix.features.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        features:
          - { name: default, flags: "" }
          - { name: all-features, flags: "--all-features" }
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked ${{ matrix.features.flags }}

  # T5.7: line coverage over the unit, property, integration and E2E
  # suites (unprivileged). scripts/ci/coverage.sh measures with
  # cargo-llvm-cov, strips the inline `#[cfg(test)] mod tests` blocks from
  # the LCOV (scripts/ci/coverage-gate.py) and applies the floor to the
  # remaining production lines. Reports are uploaded even when the floor
  # fails. The job has read-only access and does not keep the token: the
  # badge publication below is a separate job.
  #
  # The daemon is measured with the seccomp *logging* build: the LLVM
  # profile runtime calls prctl(2) with an argument the production filter
  # refuses (only PR_SET_NAME is allowed), so an enforced, instrumented
  # daemon is killed before it writes its profile. The enforced filter is
  # exercised by the privileged job.
  coverage:
    name: coverage (production lines, 85% floor)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      COVERAGE_FEATURES: seccomp-log,suspend_ram,test-fakes
      COVERAGE_FLOOR_LINES: 85
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.6.21
      - name: Measure, report, then gate
        run: scripts/ci/coverage.sh target/coverage
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage (features: $COVERAGE_FEATURES)"
            echo
            cat target/coverage/coverage-summary.md
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage/
          if-no-files-found: error

  # Publishes the coverage and test-count badges for the pushed branch to
  # the `badges` branch (path `<branch>/`); the README embeds `main/`. A
  # separate job so that only this trusted, test-free step holds a
  # write-capable token; the global concurrency group serialises every
  # writer of the shared branch. Runs on pushes to main and on manual
  # dispatch (any branch, so the mechanism can be exercised before merge).
  publish-badges:
    name: publish badges
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: coverage
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: qeminga-badges-publisher
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: target/coverage
      - name: Publish
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: scripts/ci/publish-badges.sh "$GITHUB_REF_NAME" target/coverage/coverage-summary.json target/coverage/coverage.log
      # Proves the README badges render in this private repository: fetch
      # the README as GitHub renders it, take the badge image URLs it
      # rewrote, point them at the directory just published, and check
      # that GitHub serves each one as an SVG image.
      - name: Verify the README badges render
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/verify-badges-render.sh "$GITHUB_REPOSITORY" "$GITHUB_REF_NAME"

  docs:
    name: rustdoc (-D warnings)
    runs-on: ubuntu-24.04
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features --locked

  unsafe-policy:
    name: no unsafe outside src/kernel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-unsafe.sh

  # Design §8.5: aarch64 is a supported target. The repository is private, so
  # free arm64 hosted runners are unavailable; until a runner exists (task
  # T5.2) we cross-check that everything type-checks for the target, which
  # also validates target-specific code such as the seccomp profile.
  cross-check-aarch64:
    name: check (aarch64-unknown-linux-gnu)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target aarch64-unknown-linux-gnu --all-targets --all-features --locked

  # Design §5.7 relies on the release profile (panic=abort, fat LTO, one
  # codegen unit); build it so a profile-only breakage cannot ship green.
  # Release binaries carry the seccomp feature and never `test-fakes`.
  release-build:
    name: release build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked --features seccomp

  # T5.3: the shipped unit, udev rule, sysusers entry and example config
  # are checked against the design by tests/packaging.rs; systemd-analyze
  # additionally verifies the unit with the real binary installed.
  packaging:
    name: packaging (systemd-analyze verify)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --features seccomp
      - run: sudo install -m 0755 target/debug/qeminga /usr/bin/qeminga
      - run: systemd-analyze verify --man=no packaging/systemd/qeminga.service
      - run: sudo systemd-sysusers --dry-run "$PWD/packaging/sysusers.d/qeminga.conf"
      - run: cargo test --locked --test packaging

  # T5.6: mutation testing of the gate and errno-policy code. A surviving
  # mutant fails the job (timeouts count as detections); the report is
  # uploaded either way. Test binaries run under a memory cap: a mutant
  # that allocates without bound must abort its test, not the runner.
  mutants:
    name: cargo mutants
    runs-on: ubuntu-24.04
    # About 45 minutes on the shared runners; never GitHub's six-hour default.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: cargo mutants (timeouts are detections; a missed mutant fails)
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/ci/bounded-test.sh
        run: |
          set +e
          cargo mutants --all-features --no-shuffle -j 2
          code=$?
          set -e
          echo "cargo mutants exited with $code"
          # 0: every mutant caught. 3: some timed out, which is a detection.
          # 4: some did not compile (cap_lints is on, so that is genuine).
          # Anything else (1 internal error, 2 missed) fails the job.
          case "$code" in 0 | 3 | 4) ;; *) exit "$code" ;; esac
          # The exit status reports timeouts ahead of misses, so a survivor
          # can hide behind a 3: the missed list is authoritative.
          if [ -s mutants.out/missed.txt ]; then
            echo '::error::surviving mutants:'
            cat mutants.out/missed.txt
            exit 2
          fi
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out
          path: mutants.out
          if-no-files-found: ignore

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      # Prebuilt binary: building cargo-audit from source with the pinned
      # toolchain fails once one of its dependencies raises its MSRV.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --deny warnings

  # Design D6 / T5.2: the privileged matrix on real loop-mounted ext4 and
  # xfs: freeze/thaw ioctls, the capability drop, SIGKILL recovery, the
  # watchdog, the full journald-pipe scenario, and the seccomp command
  # matrix first with the logging profile, then enforced (AC2, AC3, AC10,
  # AC11, AC13, AC15, AC17, AC18). x86-64 only until an arm64 runner
  # exists (recorded in docs/tasks.md).
  privileged:
    name: privileged (loop ext4/xfs, caps, seccomp)
    runs-on: ubuntu-24.04
    # A test stuck on a frozen loop filesystem must not run to GitHub's
    # six-hour default; the suite takes about a minute.
    timeout-minutes: 20
    env:
      # The enforced run must not carry `seccomp-log`, which `--all-features`
      # would enable (debug builds of it only log). Listed explicitly and
      # checked below.
      ENFORCED_FEATURES: seccomp,suspend_ram,test-fakes
      LOG_FEATURES: seccomp-log,test-fakes
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Install xfsprogs and the service account
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xfsprogs
          sudo groupadd -g 600 qeminga || true
          sudo useradd -u 600 -g 600 -M -r -s /usr/sbin/nologin qeminga || true
      - name: The enforced feature set really enforces
        run: |
          cfg=$(cargo rustc --lib --locked --features "$ENFORCED_FEATURES" -- --print cfg)
          echo "$cfg" | grep -q 'feature="seccomp"'
          ! echo "$cfg" | grep -q 'feature="seccomp-log"'
      - name: Build test binaries as the runner user
        run: |
          cargo test --features "$ENFORCED_FEATURES" --locked --no-run
          cargo test --features "$LOG_FEATURES" --locked --no-run
      - name: Create loop-mounted filesystems
        run: |
          set -o pipefail
          sudo env QEMINGA_LOOP_BASE=/mnt/qeminga-test scripts/ci/mk-loop-fs.sh setup | tee /tmp/loop.env
          grep -q QEMINGA_TEST_EXT4_BIND /tmp/loop.env
      - name: Privileged tests, seccomp-log build (compatibility run)
        run: |
          set -a; . /tmp/loop.env; set +a
          sudo -E env "PATH=$PATH" QEMINGA_REQUIRE_SYSTEMD=1 cargo test --features "$LOG_FEATURES" --locked -- --ignored --test-threads=1 privileged_
      - name: Privileged tests, enforced build
        run: |
          set -a; . /tmp/loop.env; set +a
          sudo -E env "PATH=$PATH" QEMINGA_REQUIRE_SYSTEMD=1 cargo test --features "$ENFORCED_FEATURES" --locked -- --ignored --test-threads=1 privileged_
      - name: Tear down loop devices
        if: always()
        run: sudo env QEMINGA_LOOP_BASE=/mnt/qeminga-test scripts/ci/mk-loop-fs.sh teardown
