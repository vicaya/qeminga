# One architecture's libvirt + QEMU KVM smoke lane (#53, AC16), called by
# libvirt-kvm.yml once per architecture so neither architecture waits for or
# depends on the other.
#
# `candidate` builds the production binary on a GitHub-hosted ephemeral runner
# and reports its SHA-256 as a job output. `kvm` runs completely unprivileged
# on a self-hosted KVM runner (no sudo, no apt-get, no Rust toolchain),
# refuses any binary whose digest differs from the build job's output, boots
# a disposable Ubuntu 24.04 guest under qemu:///session + KVM, proves KVM is
# active, installs the candidate, runs scripts/e2e-libvirt.sh, shuts the guest
# down through the agent, cleans up, and uploads result.json + diagnostics.
name: libvirt KVM smoke lane

on:
  workflow_call:
    inputs:
      arch:
        description: uname -m of the target architecture (x86_64 or aarch64)
        type: string
        required: true
      target_rev:
        description: Vetted 40-hex vicaya/qeminga commit reachable from refs/heads/main
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings

jobs:
  verify:
    name: verify caller & revision
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == format('{0}/.github/workflows/libvirt-kvm.yml@{1}', github.repository, github.ref)
      && (inputs.arch == 'x86_64' || inputs.arch == 'aarch64')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      target_rev: ${{ steps.check.outputs.target_rev }}
      build_label: ${{ steps.check.outputs.build_label }}
      expected_arch: ${{ steps.check.outputs.expected_arch }}
    steps:
      - name: Verify architecture and reachability from vicaya/qeminga main
        id: check
        env:
          ARCH: ${{ inputs.arch }}
          TARGET_REV: ${{ inputs.target_rev }}
        run: |
          case "$ARCH" in
            x86_64)  build_label="ubuntu-24.04";     expected_arch="X64" ;;
            aarch64) build_label="ubuntu-24.04-arm"; expected_arch="ARM64" ;;
            *)
              echo "::error::unsupported arch '$ARCH'"
              exit 1
              ;;
          esac
          if ! [[ "$TARGET_REV" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::target_rev is not a 40-hex commit SHA: '$TARGET_REV'"
            exit 1
          fi
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          git -C "$tmpdir" init -q
          git -C "$tmpdir" fetch --no-tags --filter=blob:none -q \
            https://github.com/vicaya/qeminga.git refs/heads/main
          if ! git -C "$tmpdir" cat-file -e "${TARGET_REV}^{commit}" 2>/dev/null; then
            echo "::error::commit $TARGET_REV is not reachable from vicaya/qeminga refs/heads/main"
            exit 1
          fi
          if ! git -C "$tmpdir" merge-base --is-ancestor "$TARGET_REV" FETCH_HEAD; then
            echo "::error::commit $TARGET_REV is not an ancestor of vicaya/qeminga refs/heads/main"
            exit 1
          fi
          {
            echo "target_rev=$TARGET_REV"
            echo "build_label=$build_label"
            echo "expected_arch=$expected_arch"
          } >> "$GITHUB_OUTPUT"

  candidate:
    name: candidate
    needs: verify
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == format('{0}/.github/workflows/libvirt-kvm.yml@{1}', github.repository, github.ref)
      && (inputs.arch == 'x86_64' || inputs.arch == 'aarch64')
    runs-on: ${{ inputs.arch == 'x86_64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    timeout-minutes: 30
    outputs:
      sha256: ${{ steps.digest.outputs.sha256 }}
    env:
      ARCH: ${{ inputs.arch }}
      EXPECTED_RUNNER_ARCH: ${{ needs.verify.outputs.expected_arch }}
      TARGET_REV: ${{ needs.verify.outputs.target_rev }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vicaya/qeminga
          ref: ${{ needs.verify.outputs.target_rev }}
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install && rustup show active-toolchain
      - name: The runner is a native ${{ inputs.arch }} machine at the vetted commit
        run: |
          [[ "$TARGET_REV" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_REV"
          test "$(uname -m)" = "$ARCH"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
          rustc -vV | grep -qx "host: ${ARCH}-unknown-linux-gnu"
      - name: Release build
        run: cargo build --release --locked --features seccomp
      - name: Digest of the built binary
        id: digest
        run: echo "sha256=$(sha256sum target/release/qeminga | cut -d' ' -f1)" | tee -a "$GITHUB_OUTPUT"
      - name: Candidate and manifest
        env:
          RUNNER_LABEL: ${{ needs.verify.outputs.build_label }}
        run: |
          version=$(cargo metadata --format-version 1 --no-deps --locked | jq -r '.packages[] | select(.name == "qeminga") | .version')
          scripts/ci/libvirt-kvm-smoke.sh manifest --out candidate \
            --binary target/release/qeminga --arch "$ARCH" --source-sha "$TARGET_REV" \
            --version "$version" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runner "$RUNNER_LABEL"
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-kvm-${{ inputs.arch }}
          path: candidate/
          if-no-files-found: error

  kvm:
    name: libvirt KVM smoke
    needs: [verify, candidate]
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && github.workflow_ref == format('{0}/.github/workflows/libvirt-kvm.yml@{1}', github.repository, github.ref)
      && (inputs.arch == 'x86_64' || inputs.arch == 'aarch64')
    runs-on: [self-hosted, linux, "${{ inputs.arch == 'x86_64' && 'X64' || 'ARM64' }}", qeminga-kvm]
    concurrency:
      group: qeminga-kvm-${{ inputs.arch }}
      cancel-in-progress: false
    timeout-minutes: 30
    env:
      ARCH: ${{ inputs.arch }}
      EXPECTED_RUNNER_ARCH: ${{ needs.verify.outputs.expected_arch }}
      TARGET_REV: ${{ needs.verify.outputs.target_rev }}
      OUT: ${{ github.workspace }}/libvirt-kvm-out
      QEMINGA_E2E_CONNECT: qemu:///session
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vicaya/qeminga
          ref: ${{ needs.verify.outputs.target_rev }}
          persist-credentials: false
      - name: The runner is a native ${{ inputs.arch }} machine at the vetted commit
        run: |
          [[ "$TARGET_REV" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_REV"
          test "$(uname -m)" = "$ARCH"
          test "$RUNNER_ARCH" = "$EXPECTED_RUNNER_ARCH"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-kvm-${{ inputs.arch }}
          path: candidate
      - name: Boot, prove KVM, install, AC16, agent shutdown
        run: |
          cache="${QEMINGA_E2E_IMAGE_CACHE:-$GITHUB_WORKSPACE/libvirt-kvm-image-cache}"
          mkdir -p "$cache"
          scripts/ci/libvirt-kvm-smoke.sh run --arch "$ARCH" \
            --candidate candidate --source-sha "$TARGET_REV" \
            --expect-sha256 "${{ needs.candidate.outputs.sha256 }}" \
            --image-cache "$cache" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --out "$OUT"
      - name: Clean up this run's domain and disks
        if: always()
        run: |
          scripts/ci/libvirt-kvm-smoke.sh cleanup --arch "$ARCH" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --out "$OUT"
      - name: Result summary
        if: always()
        run: |
          {
            echo "## libvirt KVM smoke ($ARCH)"
            echo
            echo '```json'
            cat "$OUT/result.json" 2>/dev/null || echo '{"result": "missing"}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libvirt-kvm-smoke-${{ inputs.arch }}
          path: ${{ env.OUT }}/
          if-no-files-found: error
