# libvirt + QEMU KVM smoke lane (#53, AC16) on self-hosted x86_64 and aarch64
# KVM runners (provisioned with scripts/setup-kvm-runner.sh).
#
# Security: NEVER triggered by pull_request, pull_request_target, or comments
# because this repository is public and community members may donate runners.
# Only maintainers with write access can dispatch it via workflow_dispatch,
# and each runner additionally enforces a root-owned pre-job allowlist hook.
#
# Each architecture builds its release candidate on a GitHub-hosted ephemeral
# runner, then exercises that exact SHA-256-anchored binary on the matching
# self-hosted KVM runner (no sudo, no Rust toolchain, unprivileged
# qemu:///session). tests/libvirt_kvm.rs checks both workflow files' shape and
# scripts/ci/libvirt-kvm-smoke.sh's fail-closed logic.
name: libvirt KVM smoke

on:
  workflow_dispatch:
    inputs:
      arch:
        description: Architecture(s) to exercise on self-hosted KVM runners
        type: choice
        default: both
        options:
          - both
          - x86_64
          - aarch64

permissions:
  contents: read

jobs:
  x86_64:
    name: x86_64
    if: inputs.arch == 'both' || inputs.arch == 'x86_64'
    uses: ./.github/workflows/libvirt-kvm-lane.yml
    with:
      arch: x86_64
      build_runner: ubuntu-24.04
      runner_arch: X64

  aarch64:
    name: aarch64
    if: inputs.arch == 'both' || inputs.arch == 'aarch64'
    uses: ./.github/workflows/libvirt-kvm-lane.yml
    with:
      arch: aarch64
      build_runner: ubuntu-24.04-arm
      runner_arch: ARM64
