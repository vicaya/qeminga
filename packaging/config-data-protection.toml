# qeminga: the data-protection profile (design §5.9, #43 §5, #53).
#
# CVM installation default — a guest whose only job for the host is
# snapshot coordination: freeze, thaw, status and the controls (ping,
# sync, info) stay; trim, the information commands and power management
# are disabled together. The daemon derives its authority from this file
# before it accepts a host request: without guest-shutdown it gives up
# CAP_SYS_BOOT and the reboot/sync syscalls, without the information
# commands the netlink, uname and statfs syscalls, without trim the
# FITRIM ioctl; the host cannot widen it. Install as
# /etc/qeminga/config.toml.
#
# By default (freeze_ownership_dir omitted), qeminga assumes it is the sole
# freezer in the guest (design §4.2, packaging/README.md). Guests that also
# run an independent in-guest freezer must opt into cooperative per-superblock
# ownership by configuring freeze_ownership_dir and its sticky-bit runtime
# tmpfs directory (OQ-11, #69).
[agent]
config_version          = 1
channel_path            = "/dev/virtio-ports/org.qemu.guest_agent.0"
log_level               = "info"
state_path              = "/run/qeminga/frozen"
fsfreeze_idle_timeout_secs = 30
fsfreeze_max_timeout_secs  = 300
hardening               = "enforced"
# Optional guest-enforced freeze allowlist (§4.2, §4.5, #63): when omitted, the
# host may freeze any eligible mount point and learn distinct-superblock counts
# for host-named selections and whole-guest freezes. Set this list when the
# deployment must conceal unprovisioned mount-point eligibility from the host.
# freeze_allowed_mountpoints = ["/var/lib/data"]
# freeze_ownership_dir  = "/run/qeminga-freeze-owners"

[features]
suspend_ram = false
fstrim      = false
seccomp     = true
shutdown    = false
information = false
