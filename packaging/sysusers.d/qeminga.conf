# qeminga service accounts (design §5.4, §8.3; OQ-10 §3.2):
# uid/gid 600 (privileged executor) and uid/gid 601 (unprivileged parser), no login shells.
g qeminga 600
u qeminga 600:600 "qeminga guest agent" /nonexistent /usr/sbin/nologin
g qeminga-parser 601
u qeminga-parser 601:601 "qeminga host-facing parser" /nonexistent /usr/sbin/nologin
