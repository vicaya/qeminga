# qeminga: write access to /sys/power/state for guest-suspend-ram (OQ-6).
#
# The daemon writes "mem" to /sys/power/state as the qeminga account, whose
# remaining capabilities (CAP_SYS_ADMIN, CAP_SYS_BOOT, CAP_DAC_READ_SEARCH)
# do not bypass the 0644 root:root file mode. Install this file to
# /usr/lib/tmpfiles.d/ ONLY when [features] suspend_ram = true in
# /etc/qeminga/config.toml, then run `systemd-tmpfiles --create`; it hands
# the file to group qeminga with mode 0664 on every boot. Left uninstalled,
# the default configuration (the command disabled) grants nothing.
z /sys/power/state 0664 root qeminga -
