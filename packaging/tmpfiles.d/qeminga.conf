# qeminga: the recovery marker's directory (design §4.4, §8.4, C-20).
#
# /run/qeminga/frozen is created before the first FIFREEZE and removed after
# a complete thaw, by the daemon after its drop to the qeminga account, so
# the directory must belong to that account. Install this file to
# /usr/lib/tmpfiles.d/ (always; it is not optional) and run
# `systemd-tmpfiles --create`; the unit's ExecStartPre lines provision the
# same directory for a start that precedes the next boot.
d /run/qeminga 0700 qeminga qeminga -
